name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Add Android Platform Fresh & Configure Versions
        run: |
          npx cap add android || true
          sed -i "s/minSdkVersion = .*/minSdkVersion = 24/" android/variables.gradle || true
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = 34/" android/variables.gradle || true
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = 34/" android/variables.gradle || true
          sed -i "s/androidxCoreVersion = .*/androidxCoreVersion = '1.12.0'/" android/variables.gradle || true
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
